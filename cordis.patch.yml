# 把 dsh-quota-widget 挂进 profile 的 Loader。
#
# 宿主半侧（index.js）注册只读路由 /plugins/quota-widget，用它代取各数据源的
# 额度 / 用量接口（浏览器直接请求会被跨域挡掉，且 API Key 不能下发）。
# 浏览器半侧（client.js）由 dsh-client-modules 依据 package.json 的
# dsh.client 声明下发，往 shell.overlay 里挂一个可展开的多源额度浮窗。
#
# 配置写在 profile 的 cordis.patch.yml 里（同 id 覆盖），最小可用配置只需要
# OPENCODE_GO_API_KEY；多数据源示例见 README。
- insert:
    - id: quota-widget
      name: 'dsh-quota-widget'
